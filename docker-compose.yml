version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: carbon_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: carbon_credit

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carbon_credit"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .

    container_name: carbon_backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    env_file:
      - .env

    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
